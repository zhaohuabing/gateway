name: Notify Patch Service

on:
  workflow_run:
    workflows:
      - "Tetrate Release"
      - "Tetrate FIPS Release"
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag to process (e.g. v1.8.3-tetrate or v1.8.3.1-tetrate). If empty, resolve from current SHA."
        required: false
        type: string

permissions:
  contents: read

env:
  PATCH_SERVICE_OWNER: tetrateio
  PATCH_SERVICE_REPO: patch-service
  PATCH_SERVICE_COMPONENT: eg-control-plane

jobs:
  notify-patch-service:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: release
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          run_sha="$RUN_SHA"
          if [ -z "$run_sha" ]; then
            run_sha="${GITHUB_SHA}"
          fi

          release_tag="$INPUT_RELEASE_TAG"
          if [ -z "$release_tag" ]; then
            release_tag="$(git tag --points-at "$run_sha" 'v*.*.*' | head -n1 || true)"
          fi

          if [ -z "$release_tag" ]; then
            echo "No release tag found (sha=$run_sha); skipping patch-service notification."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="${release_tag#v}"
          version="${version%-tetrate}"
          release_date="$(date -u +%F)"
          # The upstream "gateway" variant uses the bare version, not the -tetrate tag.
          # A revision has no upstream image, so its "gateway" variant is the private
          # build from tetrate-release.yaml. The FIPS variant keeps the full tag.
          is_revision=false
          if [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+-tetrate$ ]]; then
            is_revision=true
            non_fips_image="tetrate-envoy-gateway.containers.dl.tetrate.io/gateway:${release_tag}"
          else
            non_fips_image="docker.io/envoyproxy/gateway:v${version}"
          fi
          fips_image="fips-containers.teg.tetratelabs.com/gateway:${release_tag}"

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "is_revision=$is_revision" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_date=$release_date" >> "$GITHUB_OUTPUT"
          echo "non_fips_image=$non_fips_image" >> "$GITHUB_OUTPUT"
          echo "fips_image=$fips_image" >> "$GITHUB_OUTPUT"

      - name: Login to DockerHub
        if: steps.release.outputs.skip != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.TETRATE_DOCKERHUB_USER }}
          password: ${{ secrets.TETRATE_DOCKERHUB_PASS }}

      - name: Login to Cloudsmith Registry
        if: steps.release.outputs.skip != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: fips-containers.teg.tetratelabs.com
          username: tetrate-ci
          password: ${{ secrets.TETRATE_CI_CLOUDSMITH_API_KEY }}

      # Lets the existence check below read a revision's private "gateway" image.
      - name: Login to Enterprise Cloudsmith Registry
        if: steps.release.outputs.skip != 'true' && steps.release.outputs.is_revision == 'true'
        uses: docker/login-action@v3
        with:
          registry: tetrate-envoy-gateway.containers.dl.tetrate.io
          username: tetrate-ci
          password: ${{ secrets.TETRATE_CI_CLOUDSMITH_API_KEY }}

      # Point-in-time check only: we care about current registry state,
      # so this intentionally does not retry if either image is missing.
      # If either image is missing now, this run skips patch-service dispatch.
      # A later attempt only happens if another watched workflow_run event occurs.
      - name: Check both images exist
        if: steps.release.outputs.skip != 'true'
        id: verify
        env:
          NON_FIPS_IMAGE: ${{ steps.release.outputs.non_fips_image }}
          FIPS_IMAGE: ${{ steps.release.outputs.fips_image }}
        shell: bash
        run: |
          set -euo pipefail

          non_fips_ok=false
          fips_ok=false

          if docker buildx imagetools inspect "$NON_FIPS_IMAGE" >/dev/null 2>&1; then
            non_fips_ok=true
          fi

          if docker buildx imagetools inspect "$FIPS_IMAGE" >/dev/null 2>&1; then
            fips_ok=true
          fi

          if [ "$non_fips_ok" = true ] && [ "$fips_ok" = true ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Both images are available for ${{ steps.release.outputs.release_tag }}"
            exit 0
          fi

          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "Latest check failed: non-fips=$non_fips_ok, fips=$fips_ok; skipping patch-service dispatch."

      - name: Dispatch update-manifest event to patch-service
        if: steps.release.outputs.skip != 'true' && steps.verify.outputs.ready == 'true'
        env:
          TETRATE_PATCH_SERVICE_TOKEN: ${{ secrets.TETRATE_PATCH_SERVICE_TOKEN }}
          PATCH_SERVICE_OWNER: ${{ vars.PATCH_SERVICE_OWNER || env.PATCH_SERVICE_OWNER }}
          PATCH_SERVICE_REPO: ${{ vars.PATCH_SERVICE_REPO || env.PATCH_SERVICE_REPO }}
          PATCH_SERVICE_COMPONENT: ${{ vars.PATCH_SERVICE_COMPONENT || env.PATCH_SERVICE_COMPONENT }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_DATE: ${{ steps.release.outputs.release_date }}
          NON_FIPS_IMAGE: ${{ steps.release.outputs.non_fips_image }}
          FIPS_IMAGE: ${{ steps.release.outputs.fips_image }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${TETRATE_PATCH_SERVICE_TOKEN:-}" ]; then
            echo "TETRATE_PATCH_SERVICE_TOKEN is required to dispatch to patch-service."
            exit 1
          fi

          images_json="$(jq -nc --arg non_fips "$NON_FIPS_IMAGE" --arg fips "$FIPS_IMAGE" '{"gateway":$non_fips,"gateway-fips":$fips}')"

          payload="$(jq -nc \
            --arg component "$PATCH_SERVICE_COMPONENT" \
            --arg version "$VERSION" \
            --arg releaseDate "$RELEASE_DATE" \
            --arg images "$images_json" \
            '{event_type:"update-manifest",client_payload:{component:$component,version:$version,releaseDate:$releaseDate,latest:true,images:$images}}')"

          curl -fsSL -X POST \
            -H "Authorization: Bearer $TETRATE_PATCH_SERVICE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$PATCH_SERVICE_OWNER/$PATCH_SERVICE_REPO/dispatches" \
            -d "$payload"

          echo "Dispatched update-manifest for $PATCH_SERVICE_COMPONENT $VERSION"
