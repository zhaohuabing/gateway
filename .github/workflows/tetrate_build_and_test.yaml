name: Tetrate Build and Test
on:
  push:
    branches:
    - "main"
    - "tetrate-release/v*"
    paths-ignore:
    - "**/*.png"
  pull_request:
    branches:
    - "main"
    - "tetrate-release/v*"
    paths-ignore:
    - "**/*.png"

permissions:
  contents: read

jobs:
  # Check if there are changes that require running the test jobs
  changes:
    runs-on: ubuntu-latest
    # Required permissions
    permissions:
      pull-requests: read
    # Set job outputs to values from filter step
    outputs:
      run_test_workflow: ${{ steps.check-changes.outputs.run_test_workflow }}
    steps:
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
      id: check-changes
      # A dependent job will be automatically skipped if its parent job is skipped.
      # So we skip this step in pull_request event if the changes are not relevant.
      if: github.event_name == 'pull_request'
      with:
        filters: |
          run_test_workflow:
            - "!?(.github|site|release-notes)/**"
            - ".github/workflows/tetrate_build_and_test.yaml"

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: ./tools/github-actions/setup-deps
    # Generate the installation manifests first, so it can check
    # for errors while running `make -k lint`
    - run: IMAGE_PULL_POLICY=Always make generate-manifests
    - run: make lint-deps
    - run: make -k lint

  gen-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: ./tools/github-actions/setup-deps
    - run: make -k gen-check

  license-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: ./tools/github-actions/setup-deps
    - run: make -k licensecheck

  coverage-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read   #  for actions/checkout
      id-token: write  #  for fetching OIDC token
    needs:
    - changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.run_test_workflow == 'true' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: ./tools/github-actions/setup-deps

    # test
    - name: Run Coverage Tests
      run: make go.test.coverage
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
      with:
        fail_ci_if_error: true
        files: ./coverage.xml
        name: codecov-envoy-gateway
        verbose: true
        use_oidc: true
        version: v11.2.8

  build:
    runs-on: ubuntu-latest
    needs: [changes, lint, gen-check, license-check, coverage-test]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.run_test_workflow == 'true' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # For main branch builds, we need to fetch tags so go binary will be built with
      # the recent vX.Y.Z-rc.0 tag, which helps avoid false positives in vulnerability scans.
      # `fetch-tags: true` doesn't work: https://github.com/actions/checkout/issues/1471
      # As a workaround `filter: tree:0` is used to create a treeless clone.
      # See:
      # https://github.com/actions/checkout/issues/1471#issuecomment-1755639487
      # https://github.blog/open-source/git/get-up-to-speed-with-partial-clone-and-shallow-clone/
      with:
        fetch-depth: ${{ github.ref == 'refs/heads/main' && '0' || '1' }}
        filter: ${{ github.ref == 'refs/heads/main' && 'tree:0' || '' }}
    - uses: ./tools/github-actions/setup-deps

    # Build both linux/amd64 and linux/arm64 on the branches the publish job runs
    # on (main and tetrate-release/v*), since it pushes a multi-arch image.
    # Only linux/amd64 elsewhere, e.g. on PRs.
    - name: Build EG Binaries
      run: make build-multiarch BINS="envoy-gateway" PLATFORMS="${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/tetrate-release/v')) && 'linux_amd64 linux_arm64' || 'linux_amd64' }}"

    - name: Upload EG Binaries
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: envoy-gateway
        path: bin/

  build-egctl:
    runs-on: ubuntu-latest
    needs: [changes, lint, gen-check, license-check, coverage-test]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.run_test_workflow == 'true' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: ./tools/github-actions/setup-deps

    - name: Build egctl Binary
      run: make build BINS="egctl" PLATFORM="linux_amd64"

  conformance-test:
    # github-hosted runners (4 vCPU / 16 GB) can't schedule the ~95 Envoy proxy
    # deployments the conformance suite creates: some Gateways never leave
    # `Programmed=False/NoResources`, which stalls every test waiting on the
    # namespace and blows the 20m `go test` timeout. Use tetrate's self-hosted
    # runners, same as the e2e tests.
    runs-on: default-runner-set
    needs:
    - changes
    - build
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.run_test_workflow == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        target:
        - version: v1.32.11
          ipFamily: ipv4
          profile: default
          gwapiChannel: standard
        - version: v1.33.7
          ipFamily: ipv4
          profile: default
          gwapiChannel: experimental
        - version: v1.34.3
          ipFamily: ipv6  # only run ipv6 test on this version to save time
          profile: default
          gwapiChannel: experimental
        # TODO: this's IPv4 first, need a way to test IPv6 first.
        - version: v1.35.0
          ipFamily: dual  # only run dual test on latest version to save time
          profile: default
          gwapiChannel: experimental
        - version: v1.35.0
          ipFamily: dual  # only run dual test on latest version to save time
          gwapiChannel: experimental
          profile: gateway-namespace-mode
        - version: v1.35.0
          ipFamily: ipv4
          profile: xds-name-scheme-v2
          gwapiChannel: experimental
        - version: v1.35.0
          ipFamily: ipv4
          profile: watch-namespaces
          gwapiChannel: experimental
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: ./tools/github-actions/setup-deps
    - uses: ./tools/github-actions/reclaim-storage

    - name: Download EG Binaries
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: envoy-gateway
        path: bin/

    - name: Give Privileges To EG Binaries
      run: chmod +x bin/linux/*/envoy-gateway

    # conformance
    - name: Run Standard Conformance Tests
      env:
        KIND_NODE_TAG: ${{ matrix.target.version }}
        IMAGE_PULL_POLICY: IfNotPresent
        IP_FAMILY: ${{ matrix.target.ipFamily }}
        KUBE_DEPLOY_PROFILE: ${{ matrix.target.profile }}
        E2E_GATEWAY_API_CHANNEL: ${{ matrix.target.gwapiChannel }}
        # set ACTIONS_STEP_DEBUG to true if context runner.debug is '1',
        # which means to dump the current state when there's a case failed.
        ACTIONS_STEP_DEBUG: ${{ runner.debug == '1' }}
        SKIP_GO_BUILD: "true"
      run: |
        export KUBECONFIG="${HOME}/.kube/config"
        make conformance

  e2e-test:
    # use tetrate's self-hosted runners for e2e tests to speed up the workflow and avoid potential flaky issues in github-hosted runners.
    runs-on: default-runner-set
    needs:
    - changes
    - build
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.run_test_workflow == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        target:
        - version: v1.32.11
          ipFamily: ipv4
          profile: default
        - version: v1.33.7
          ipFamily: ipv4
          profile: default
        - version: v1.34.3
          ipFamily: ipv6  # only run ipv6 test on this version to save time
          profile: default
        # TODO: this's IPv4 first, need a way to test IPv6 first.
        - version: v1.35.0
          ipFamily: dual  # only run dual test on latest version to save time
          profile: default
        - version: v1.35.0
          ipFamily: dual  # only run dual test on latest version to save time
          profile: gateway-namespace-mode
        - version: v1.35.0
          ipFamily: ipv4
          profile: xds-name-scheme-v2
        - version: v1.35.0
          ipFamily: ipv4
          profile: watch-namespaces

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: ./tools/github-actions/setup-deps
    - uses: ./tools/github-actions/reclaim-storage

    - name: Download EG Binaries
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: envoy-gateway
        path: bin/

    - name: Give Privileges To EG Binaries
      run: chmod +x bin/linux/*/envoy-gateway

    # E2E
    - name: Run E2E Tests
      env:
        KIND_NODE_TAG: ${{ matrix.target.version }}
        IMAGE_PULL_POLICY: IfNotPresent
        IP_FAMILY: ${{ matrix.target.ipFamily }}
        KUBE_DEPLOY_PROFILE: ${{ matrix.target.profile }}
        E2E_TIMEOUT: 1h
        NUM_WORKERS: 2
        # QPS more than 2000 may cause e2e flaky test.
        # This is not the limit of Envoy Gateway,
        # but the limit of running e2e tests in github CI.
        E2E_BACKEND_UPGRADE_QPS: "2000"
        # Cluster trust bundle reach beta in v1.33, so we can enable it for v1.33 and later.
        ENABLE_CLUSTER_TRUST_BUNDLE: ${{ startsWith(matrix.target.version, 'v1.33') }}
        # set ACTIONS_STEP_DEBUG to true if context runner.debug is '1',
        # which means to dump the current state when there's a case failed.
        ACTIONS_STEP_DEBUG: ${{ runner.debug == '1' }}
        SKIP_GO_BUILD: "true"
      # The self-hosted runner executes inside a pod, so an in-cluster service
      # account config is present. controller-runtime's config.GetConfig()
      # prefers in-cluster config over ~/.kube/config when KUBECONFIG is unset,
      # which makes the e2e test talk to the host cluster (where the runner SA
      # has no permissions) instead of the kind cluster. Setting KUBECONFIG
      # forces it to use the kind cluster's kubeconfig. kind/kubectl honor it too.
      run: |
        export KUBECONFIG="${HOME}/.kube/config"
        make e2e

  resilience-test:
    runs-on: default-runner-set
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.run_test_workflow == 'true' }}
    needs:
    - build
    - changes
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: ./tools/github-actions/setup-deps
    - uses: ./tools/github-actions/reclaim-storage

    - name: Download EG Binaries
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: envoy-gateway
        path: bin/

    - name: Give Privileges To EG Binaries
      run: chmod +x bin/linux/*/envoy-gateway

    - name: Resilience Test
      env:
        IMAGE_PULL_POLICY: IfNotPresent
        CUSTOM_CNI: "true"
        SKIP_GO_BUILD: "true"
      run: |
        export KUBECONFIG="${HOME}/.kube/config"
        make resilience

  publish:
    runs-on: ubuntu-latest
    needs: [conformance-test, e2e-test]
    # Releases are cut from `tetrate-release/v*`, not `main`. The commit image
    # must be published from those branches too, because tetrate-release.yaml
    # retags `tetrate/gateway-dev:<short-sha>` into `tetrate/gateway:<tag>` and
    # cannot build it itself.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/tetrate-release/v'))
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: ./tools/github-actions/setup-deps

    - name: Download EG Binaries
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: envoy-gateway
        path: bin/

    - name: Give Privileges To EG Binaries
      run: chmod +x bin/linux/*/envoy-gateway

    # build and push image
    - name: Login to DockerHub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
      with:
        username: ${{ secrets.TETRATE_DOCKERHUB_USER }}
        password: ${{ secrets.TETRATE_DOCKERHUB_PASS }}

    - name: Setup Multiarch Environment
      run: make image.multiarch.setup

    - name: Build and Push EG Commit Image
      # tag is set to the short SHA of the commit
      run: make image.push.multiarch PLATFORMS="linux_amd64 linux_arm64" IMAGE=tetrate/gateway-dev

    - name: Build and Push EG Latest Image
      # tag is set to `latest` when pushing to main branch
      run: make image.push.multiarch TAG=latest PLATFORMS="linux_amd64 linux_arm64" IMAGE=tetrate/gateway-dev

    - name: Build and Push EG Latest Helm Chart
      # use `0.0.0` as the default latest version.
      # use `Always` image pull policy for latest version.
      run: |
        IMAGE_PULL_POLICY=Always OCI_REGISTRY=oci://docker.io/tetrate CHART_VERSION=v0.0.0-latest TAG=latest make helm-push
        IMAGE_PULL_POLICY=Always OCI_REGISTRY=oci://docker.io/tetrate CHART_VERSION=0.0.0-latest TAG=latest make helm-push

  # Aggregate all the required jobs and make it easier to customize CI required jobs
  ci-checks:
    runs-on: ubuntu-latest
    needs:
    - lint
    - gen-check
    - license-check
    - coverage-test
    - build
    - build-egctl
    - conformance-test
    - e2e-test
    - resilience-test
    - publish
    # We need this to run always to force-fail (and not skip) if any needed
    # job has failed. Otherwise, a skipped job will not fail the workflow.
    if: always()
    steps:
    - run: |
        echo "CI checks completed"
        [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "false" ] || exit 1
