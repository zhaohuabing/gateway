name: "Tetrate FIPS Release"

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
    - "v*.*.*"

permissions:
  contents: read

env:
  PLATFORMS: "linux_amd64"
  IMAGE_PLATFORMS: "linux/amd64"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: ./tools/github-actions/setup-deps
    # Generate the installation manifests first, so it can check
    # for errors while running `make -k lint`
    - run: IMAGE_PULL_POLICY=Always make generate-manifests
    - run: make lint-deps
    - run: make -k lint

  gen-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: ./tools/github-actions/setup-deps
    - run: make -k gen-check

  license-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: ./tools/github-actions/setup-deps
    - run: make -k licensecheck

  coverage-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read     #  for actions/checkout
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: ./tools/github-actions/setup-deps

    # test
    - name: Run Coverage Tests
      run: make go.test.coverage

  build:
    runs-on: ubuntu-latest
    needs: [ lint, gen-check, license-check, coverage-test ]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: ./tools/github-actions/setup-deps

    - name: Build EG Multiarch Binaries
      run: make fips.build-multiarch PLATFORMS=${{ env.PLATFORMS }}

    - name: Upload EG Binaries
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: envoy-gateway
        path: bin/

  conformance-test:
    runs-on: default-runner-set
    needs: [ build ]
    strategy:
      fail-fast: false
      matrix:
        target:
        - version: v1.33.12
          ipFamily: ipv4
          profile: default
          gwapiChannel: standard
        - version: v1.34.8
          ipFamily: ipv4
          profile: default
          gwapiChannel: experimental
        - version: v1.35.5
          ipFamily: ipv6  # only run ipv6 test on this version to save time
          profile: default
          gwapiChannel: experimental
        # TODO: this's IPv4 first, need a way to test IPv6 first.
        - version: v1.36.1
          ipFamily: dual  # only run dual test on latest version to save time
          profile: default
          gwapiChannel: experimental
        - version: v1.36.1
          ipFamily: dual  # only run dual test on latest version to save time
          gwapiChannel: experimental
          profile: gateway-namespace-mode
        - version: v1.36.1
          ipFamily: ipv4
          profile: xds-name-scheme-v2
          gwapiChannel: experimental
        - version: v1.36.1
          ipFamily: ipv4
          profile: watch-namespaces
          gwapiChannel: experimental
        - version: v1.36.1
          ipFamily: ipv4
          profile: merge-backends
          gwapiChannel: experimental
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: ./tools/github-actions/setup-deps
    - uses: ./tools/github-actions/reclaim-storage

    - name: Download EG Binaries
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: envoy-gateway
        path: bin/

    - name: Give Privileges To EG Binaries
      run: |
        chmod +x bin/linux/amd64/envoy-gateway

    # conformance
    - name: Run Standard Conformance Tests
      env:
        KIND_NODE_TAG: ${{ matrix.target.version }}
        IMAGE_PULL_POLICY: IfNotPresent
        IP_FAMILY: ${{ matrix.target.ipFamily }}
        KUBE_DEPLOY_PROFILE: ${{ matrix.target.profile }}
        E2E_GATEWAY_API_CHANNEL: ${{ matrix.target.gwapiChannel }}
        # set ACTIONS_STEP_DEBUG to true if context runner.debug is '1',
        # which means to dump the current state when there's a case failed.
        ACTIONS_STEP_DEBUG: ${{ runner.debug == '1' }}
        SKIP_GO_BUILD: "true"
      run: |
        export KUBECONFIG="${HOME}/.kube/config"
        make conformance

  e2e-test:
    # use tetrate's self-hosted runners for e2e tests to speed up the workflow and avoid potential flaky issues in github-hosted runners.
    runs-on: default-runner-set
    needs: [ build ]
    strategy:
      fail-fast: false
      matrix:
        target:
        - version: v1.33.12
          ipFamily: ipv4
          profile: default
        - version: v1.34.8
          ipFamily: ipv4
          profile: default
        - version: v1.35.5
          ipFamily: ipv6  # only run ipv6 test on this version to save time
          profile: default
        # TODO: this's IPv4 first, need a way to test IPv6 first.
        - version: v1.36.1
          ipFamily: dual  # only run dual test on latest version to save time
          profile: default
        - version: v1.36.1
          ipFamily: dual  # only run dual test on latest version to save time
          profile: gateway-namespace-mode
        - version: v1.36.1
          ipFamily: ipv4
          profile: xds-name-scheme-v2
        - version: v1.36.1
          ipFamily: ipv4
          profile: watch-namespaces
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: ./tools/github-actions/setup-deps
    - uses: ./tools/github-actions/reclaim-storage

    - name: Download EG Binaries
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: envoy-gateway
        path: bin/

    - name: Give Privileges To EG Binaries
      run: |
        chmod +x bin/linux/amd64/envoy-gateway

    # E2E
    - name: Run E2E Tests
      env:
        KIND_NODE_TAG: ${{ matrix.target.version }}
        IMAGE_PULL_POLICY: IfNotPresent
        IP_FAMILY: ${{ matrix.target.ipFamily }}
        KUBE_DEPLOY_PROFILE: ${{ matrix.target.profile }}
        E2E_TIMEOUT: 1h
        NUM_WORKERS: 2
        # QPS more than 2000 may cause e2e flaky test.
        # This is not the limit of Envoy Gateway,
        # but the limit of running e2e tests in github CI.
        E2E_BACKEND_UPGRADE_QPS: "2000"
        # Cluster trust bundle reach beta in v1.33, so we can enable it for v1.33 and later.
        ENABLE_CLUSTER_TRUST_BUNDLE: ${{ startsWith(matrix.target.version, 'v1.33') }}
        # set ACTIONS_STEP_DEBUG to true if context runner.debug is '1',
        # which means to dump the current state when there's a case failed.
        ACTIONS_STEP_DEBUG: ${{ runner.debug == '1' }}
        SKIP_GO_BUILD: "true"
      # The self-hosted runner executes inside a pod, so an in-cluster service
      # account config is present. controller-runtime's config.GetConfig()
      # prefers in-cluster config over ~/.kube/config when KUBECONFIG is unset,
      # which makes the e2e test talk to the host cluster (where the runner SA
      # has no permissions) instead of the kind cluster. Setting KUBECONFIG
      # forces it to use the kind cluster's kubeconfig. kind/kubectl honor it too.
      run: |
        export KUBECONFIG="${HOME}/.kube/config"
        make e2e

  publish:
    runs-on: ubuntu-latest
    needs: [ conformance-test, e2e-test ]
    steps:
    # Keep a four-part tag without -tetrate out of the FIPS registry, as tetrate-release.yaml does.
    - name: Reject four-part tags without -tetrate
      shell: bash
      run: |
        tag="${GITHUB_REF##*/}"
        if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::$tag is a four-part tag; revisions must end in -tetrate."
          exit 1
        fi

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: ./tools/github-actions/setup-deps
    - uses: ./tools/github-actions/reclaim-storage

    - name: Download EG Binaries
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: envoy-gateway
        path: bin/

    - name: Give Privileges To EG Binaries
      run: |
        chmod +x bin/linux/amd64/envoy-gateway

    - name: Setup Multiarch Environment
      if: github.event_name == 'push'
      run: make image.multiarch.setup

    - name: Extract Release Tag
      id: vars
      shell: bash
      run: echo "release_tag=$(echo ${GITHUB_REF##*/})" >> $GITHUB_ENV

    # build and push image
    - name: Login to Cloudsmith Registry
      if: github.event_name == 'push'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
      with:
        registry: fips-containers.teg.tetratelabs.com
        username: tetrate-ci
        password: ${{ secrets.TETRATE_CI_CLOUDSMITH_API_KEY}}

    - name: Build and Push EG Commit Image to Cloudsmith Registry
      if: github.event_name == 'push'
      # tag is set to the short SHA of the commit
      run: make image.push.multiarch TAG=${{ env.release_tag }} PLATFORMS=${{ env.PLATFORMS }} IMAGE_PLATFORMS=${{ env.IMAGE_PLATFORMS }} IMAGE=fips-containers.teg.tetratelabs.com/gateway
