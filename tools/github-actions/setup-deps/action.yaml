name: setup-deps
description: Install host system dependencies

runs:
  using: composite
  steps:
    - shell: bash
      run: sudo apt-get install libbtrfs-dev -y
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v6.0.2
      with:
        go-version-file: go.mod
        cache: true
    # GitHub-hosted runners ship kubectl, but self-hosted runners (used for e2e
    # tests) don't. Install it explicitly so kind-based scripts can use it.
    - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d  # v5.1.0
      with:
        version: v1.36.1
